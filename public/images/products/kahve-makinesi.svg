<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 260" width="100%" height="100%" fill="none">
  <!-- Desk surface line -->
  <line x1="20" y1="230" x2="220" y2="230" stroke="#18181B" stroke-width="2" stroke-linecap="round"/>

  <!-- Coffee Machine Body -->
  <!-- Water Tank at back -->
  <rect x="146" y="55" width="46" height="150" rx="8" fill="#F4F4F5" stroke="#18181B" stroke-width="2"/>
  <path d="M 152 180 Q 169 176 186 180 L 186 198 Q 169 198 152 198 Z" fill="#E4E4E7" opacity="0.6"/>
  <!-- Water measurement ticks -->
  <line x1="184" y1="90" x2="188" y2="90" stroke="#71717A" stroke-width="1.5"/>
  <line x1="182" y1="110" x2="188" y2="110" stroke="#71717A" stroke-width="1.5"/>
  <line x1="184" y1="130" x2="188" y2="130" stroke="#71717A" stroke-width="1.5"/>

  <!-- Main Machine Housing -->
  <path d="M 64 65 Q 64 45 84 45 L 140 45 Q 150 45 150 55 L 150 228 L 64 228 Z" fill="#FFFFFF" stroke="#18181B" stroke-width="2.5"/>

  <!-- Top Lever Handle (Chrome capsule lever) -->
  <rect x="74" y="34" width="60" height="12" rx="6" fill="#F7F7F5" stroke="#18181B" stroke-width="2"/>
  <circle cx="128" cy="40" r="5" fill="#0F766E"/>

  <!-- Espresso Buttons (Single / Double) -->
  <circle cx="92" cy="74" r="6" fill="#FFFFFF" stroke="#18181B" stroke-width="1.5"/>
  <circle cx="92" cy="74" r="2" fill="#0F766E"/>
  
  <circle cx="118" cy="74" r="6" fill="#FFFFFF" stroke="#18181B" stroke-width="1.5"/>
  <circle cx="116" cy="74" r="1.5" fill="#18181B"/>
  <circle cx="120" cy="74" r="1.5" fill="#18181B"/>

  <!-- Dispenser head & Spout -->
  <rect x="80" y="96" width="50" height="26" rx="4" fill="#18181B"/>
  <path d="M 102 122 L 108 122 L 106 130 L 104 130 Z" fill="#18181B"/>

  <!-- Fresh coffee droplet / stream -->
  <line x1="105" y1="131" x2="105" y2="152" stroke="#18181B" stroke-width="2" stroke-linecap="round"/>
  <circle cx="105" cy="158" r="2" fill="#18181B"/>

  <!-- Drip Tray at Base -->
  <rect x="56" y="208" width="86" height="20" rx="4" fill="#F7F7F5" stroke="#18181B" stroke-width="2"/>
  <!-- Drip grid slots -->
  <line x1="68" y1="214" x2="78" y2="214" stroke="#18181B" stroke-width="1.5"/>
  <line x1="84" y1="214" x2="94" y2="214" stroke="#18181B" stroke-width="1.5"/>
  <line x1="100" y1="214" x2="110" y2="214" stroke="#18181B" stroke-width="1.5"/>
  <line x1="116" y1="214" x2="126" y2="214" stroke="#18181B" stroke-width="1.5"/>

  <!-- Minimal Ceramic Cup on tray -->
  <path d="M 88 168 L 92 208 L 118 208 L 122 168 Z" fill="#FFFFFF" stroke="#18181B" stroke-width="2"/>
  <!-- Cup handle -->
  <path d="M 120 176 Q 132 176 132 188 Q 132 200 119 200" stroke="#18181B" stroke-width="2" fill="none"/>
  
  <!-- Steam wisps -->
  <path d="M 98 158 Q 94 150 99 144" stroke="#71717A" stroke-width="1.2" stroke-linecap="round" fill="none"/>
  <path d="M 110 156 Q 114 148 108 140" stroke="#71717A" stroke-width="1.2" stroke-linecap="round" fill="none"/>
</svg>
