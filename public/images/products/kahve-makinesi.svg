<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200" width="160" height="200">
  <defs>
    <linearGradient id="bg-km" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF7ED"/>
      <stop offset="100%" stop-color="#FEF9C3"/>
    </linearGradient>
    <linearGradient id="machine-km" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="steam-km" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#BFDBFE" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#BFDBFE" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Studio backdrop -->
  <rect width="160" height="200" fill="url(#bg-km)" rx="16"/>
  <!-- Shadow -->
  <ellipse cx="80" cy="178" rx="48" ry="8" fill="#FCD34D" opacity="0.3"/>

  <!-- Machine body -->
  <rect x="22" y="50" width="116" height="120" fill="url(#machine-km)" rx="10"/>
  <!-- Body top highlight -->
  <rect x="22" y="50" width="116" height="8" fill="#64748B" rx="8"/>
  <!-- Body side highlight -->
  <rect x="22" y="50" width="5" height="120" fill="#64748B" opacity="0.4" rx="2"/>

  <!-- Water tank (back, transparent blue) -->
  <rect x="100" y="38" width="30" height="70" fill="#93C5FD" rx="6" opacity="0.7"/>
  <rect x="100" y="38" width="30" height="8" fill="#BFDBFE" rx="4" opacity="0.8"/>
  <!-- Water level -->
  <rect x="102" y="80" width="26" height="26" fill="#60A5FA" rx="4" opacity="0.5"/>
  <text x="115" y="95" text-anchor="middle" font-size="6" fill="#1D4ED8" font-weight="bold">75%</text>

  <!-- Pressure gauge -->
  <circle cx="50" cy="80" r="18" fill="#1E293B" stroke="#94A3B8" stroke-width="2"/>
  <circle cx="50" cy="80" r="13" fill="#F8FAFC"/>
  <!-- Gauge arc -->
  <path d="M 38 90 A 13 13 0 1 1 62 90" fill="none" stroke="#E4E4E7" stroke-width="2"/>
  <path d="M 38 90 A 13 13 0 0 1 56 70" fill="none" stroke="#10B981" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Gauge needle -->
  <line x1="50" y1="80" x2="58" y2="68" stroke="#DC2626" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="50" cy="80" r="2" fill="#DC2626"/>
  <text x="50" y="93" text-anchor="middle" font-size="5" fill="#71717A">bar</text>

  <!-- Power button -->
  <circle cx="85" cy="78" r="10" fill="#18181B" stroke="#334155" stroke-width="1"/>
  <circle cx="85" cy="78" r="7" fill="#0F766E"/>
  <text x="85" y="82" text-anchor="middle" font-size="10" fill="white" font-weight="bold">&#9211;</text>

  <!-- Portafilter group head -->
  <rect x="38" y="130" width="60" height="12" fill="#94A3B8" rx="4"/>
  <rect x="52" y="142" width="32" height="6" fill="#78716C" rx="3"/>
  <!-- Portafilter handle -->
  <rect x="84" y="138" width="22" height="8" fill="#292524" rx="4"/>

  <!-- Drip tray -->
  <rect x="28" y="160" width="104" height="8" fill="#94A3B8" rx="2"/>
  <rect x="30" y="162" width="100" height="4" fill="#CBD5E1" rx="1" opacity="0.4"/>

  <!-- Espresso cup -->
  <ellipse cx="68" cy="162" rx="16" ry="5" fill="#FEF9C3"/>
  <path d="M 52 162 Q 52 182 68 182 Q 84 182 84 162" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1"/>
  <ellipse cx="68" cy="162" rx="16" ry="5" fill="#FEF9C3"/>
  <!-- Coffee -->
  <ellipse cx="68" cy="163" rx="12" ry="3.5" fill="#92400E"/>
  <!-- Espresso stream -->
  <line x1="62" y1="148" x2="61" y2="162" stroke="#78350F" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <line x1="68" y1="148" x2="68" y2="162" stroke="#92400E" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <line x1="74" y1="148" x2="75" y2="162" stroke="#78350F" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <!-- Cup handle -->
  <path d="M 84 168 Q 92 168 92 174 Q 92 180 84 180" fill="none" stroke="#FDE68A" stroke-width="2" stroke-linecap="round"/>
  <!-- Saucer -->
  <ellipse cx="68" cy="183" rx="20" ry="4" fill="#FEF3C7" stroke="#FDE68A" stroke-width="0.5"/>

  <!-- Steam wisps -->
  <path d="M 58 148 Q 54 138 58 128 Q 62 118 58 108" fill="none" stroke="url(#steam-km)" stroke-width="2" stroke-linecap="round"/>
  <path d="M 68 145 Q 65 135 68 124 Q 71 113 68 103" fill="none" stroke="url(#steam-km)" stroke-width="2" stroke-linecap="round"/>
  <path d="M 78 148 Q 82 138 78 128 Q 74 118 78 108" fill="none" stroke="url(#steam-km)" stroke-width="2" stroke-linecap="round"/>

  <!-- Brand plate on machine -->
  <rect x="34" y="102" width="52" height="18" fill="#1E293B" rx="3"/>
  <text x="60" y="114" text-anchor="middle" font-family="Georgia, serif" font-size="7" fill="#94A3B8" letter-spacing="1">DeLonghi</text>
</svg>
