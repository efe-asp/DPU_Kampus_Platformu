<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200" width="160" height="200">
  <defs>
    <linearGradient id="bg-ml" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="100%" stop-color="#FEF3C7"/>
    </linearGradient>
    <radialGradient id="glow-ml" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#FCD34D" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FCD34D" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Studio backdrop -->
  <rect width="160" height="200" fill="url(#bg-ml)" rx="16"/>
  <!-- Warm glow aura -->
  <ellipse cx="72" cy="90" rx="65" ry="60" fill="url(#glow-ml)"/>
  <!-- Shadow -->
  <ellipse cx="80" cy="178" rx="45" ry="7" fill="#FCD34D" opacity="0.25"/>

  <!-- Base -->
  <ellipse cx="90" cy="170" rx="38" ry="8" fill="#1E293B"/>
  <rect x="58" y="162" width="64" height="10" fill="#334155" rx="4"/>
  <!-- Base highlight -->
  <rect x="60" y="162" width="62" height="4" fill="#475569" rx="3"/>

  <!-- Arm lower section -->
  <rect x="84" y="110" width="10" height="58" fill="#1E293B" rx="4"/>
  <!-- Arm joint lower -->
  <circle cx="89" cy="110" r="8" fill="#334155"/>
  <circle cx="89" cy="110" r="5" fill="#475569"/>

  <!-- Arm upper section (angled) -->
  <rect x="62" y="62" width="10" height="60" fill="#1E293B" rx="4" transform="rotate(-20, 67, 92)"/>
  <!-- Arm joint upper -->
  <circle cx="89" cy="110" r="6" fill="#1E293B" stroke="#64748B" stroke-width="1.5"/>

  <!-- Lamp head (cone shade) -->
  <polygon points="30,55 100,55 85,95 45,95" fill="#FCD34D" rx="2"/>
  <!-- Shade inner dark -->
  <polygon points="34,57 96,57 82,93 48,93" fill="#F59E0B" opacity="0.5"/>
  <!-- Shade highlight -->
  <polygon points="34,57 70,57 60,66 42,66" fill="#FEF3C7" opacity="0.4"/>
  <!-- Shade rim top -->
  <rect x="28" y="52" width="74" height="6" fill="#D97706" rx="2"/>
  <!-- Shade rim bottom -->
  <rect x="43" y="93" width="44" height="4" fill="#B45309" rx="2"/>

  <!-- Bulb inside shade -->
  <ellipse cx="65" cy="70" rx="12" ry="10" fill="#FEF9C3" opacity="0.9"/>
  <ellipse cx="65" cy="70" rx="8" ry="6" fill="#FFFBEB"/>
  <circle cx="65" cy="68" r="4" fill="white" opacity="0.7"/>

  <!-- Light beam (triangular projection) -->
  <polygon points="43,97 87,97 110,145 20,145" fill="#FCD34D" opacity="0.08"/>
  <polygon points="45,97 85,97 102,135 28,135" fill="#FCD34D" opacity="0.06"/>

  <!-- Desk surface under lamp -->
  <rect x="10" y="168" width="140" height="20" fill="#FDE68A" rx="4" opacity="0.3"/>

  <!-- Books on desk (detail) -->
  <rect x="112" y="140" width="10" height="28" fill="#10B981" rx="1" transform="rotate(-2, 117, 155)"/>
  <rect x="123" y="142" width="10" height="26" fill="#6366F1" rx="1" transform="rotate(3, 128, 155)"/>
  <rect x="134" y="140" width="10" height="28" fill="#F59E0B" rx="1" transform="rotate(-1, 139, 155)"/>

  <!-- Cord -->
  <path d="M 89 170 Q 112 172 118 180 Q 124 190 140 188" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round"/>

  <!-- Switch on arm -->
  <rect x="82" y="136" width="14" height="8" fill="#475569" rx="4"/>
  <rect x="85" y="137" width="8" height="6" fill="#10B981" rx="3"/>
</svg>
