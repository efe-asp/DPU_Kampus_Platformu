<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 260" width="100%" height="100%" fill="none">
  <!-- Desk surface line -->
  <line x1="20" y1="236" x2="220" y2="236" stroke="#18181B" stroke-width="2" stroke-linecap="round"/>

  <!-- Light beam cone radiating downwards (soft editorial tint) -->
  <polygon points="68,102 18,236 150,236 112,102" fill="#FEF3C7" opacity="0.45"/>
  <line x1="68" y1="102" x2="18" y2="236" stroke="#D97706" stroke-width="1" stroke-dasharray="3 3" opacity="0.5"/>
  <line x1="112" y1="102" x2="150" y2="236" stroke="#D97706" stroke-width="1" stroke-dasharray="3 3" opacity="0.5"/>

  <!-- Heavy Circular Lamp Base -->
  <ellipse cx="160" cy="232" rx="34" ry="10" fill="#FFFFFF" stroke="#18181B" stroke-width="2.5"/>
  <ellipse cx="160" cy="228" rx="28" ry="7" fill="#F7F7F5" stroke="#E4E4E7" stroke-width="1.2"/>
  
  <!-- Touch control button & USB icon on base -->
  <circle cx="160" cy="228" r="3.5" fill="#0F766E"/>
  <rect x="180" y="228" width="6" height="3" rx="1" fill="#18181B"/>

  <!-- Base swivel socket -->
  <rect x="156" y="210" width="8" height="18" rx="2" fill="#18181B"/>
  <circle cx="160" cy="210" r="5" fill="#FFFFFF" stroke="#18181B" stroke-width="2"/>

  <!-- Lower Arm (Dual parallel struts) -->
  <line x1="158" y1="210" x2="118" y2="130" stroke="#18181B" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="162" y1="210" x2="122" y2="130" stroke="#71717A" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Mid Elbow Joint & Tension Spring -->
  <circle cx="120" cy="130" r="6" fill="#FFFFFF" stroke="#18181B" stroke-width="2"/>
  <circle cx="120" cy="130" r="2" fill="#0F766E"/>

  <!-- Upper Arm -->
  <line x1="120" y1="130" x2="88" y2="92" stroke="#18181B" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Lamp Shade Neck & Cone Head -->
  <!-- Swivel at head -->
  <circle cx="88" cy="92" r="4.5" fill="#FFFFFF" stroke="#18181B" stroke-width="2"/>
  
  <!-- Asymmetric modern conical shade -->
  <path d="M 88 92 L 68 102 L 112 102 Z" fill="#18181B"/>
  <ellipse cx="90" cy="102" rx="22" ry="5" fill="#FFFFFF" stroke="#18181B" stroke-width="2"/>
  <ellipse cx="90" cy="102" rx="16" ry="3.5" fill="#FEF3C7"/>

  <!-- Minimal decorative books resting under light on desk -->
  <g transform="translate(40, 218)">
    <rect width="60" height="9" rx="2" fill="#FFFFFF" stroke="#18181B" stroke-width="1.5"/>
    <rect x="6" y="-7" width="50" height="8" rx="2" fill="#F7F7F5" stroke="#18181B" stroke-width="1.5"/>
    <line x1="56" y1="-3" x2="68" y2="-3" stroke="#0F766E" stroke-width="2"/>
  </g>
</svg>
