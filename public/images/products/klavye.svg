<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 140" width="200" height="140">
  <defs>
    <linearGradient id="bg-kl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <linearGradient id="body-kl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>
  <!-- Studio backdrop -->
  <rect width="200" height="140" fill="url(#bg-kl)" rx="16"/>
  <!-- Shadow -->
  <ellipse cx="100" cy="124" rx="75" ry="8" fill="#CBD5E1" opacity="0.5"/>

  <!-- Keyboard body -->
  <rect x="12" y="30" width="176" height="88" fill="url(#body-kl)" rx="8"/>
  <!-- Body top highlight edge -->
  <rect x="12" y="30" width="176" height="4" fill="#475569" rx="4"/>
  <!-- Body side highlight -->
  <rect x="12" y="30" width="4" height="88" fill="#475569" opacity="0.4" rx="2"/>

  <!-- Function row keys -->
  <g>
    <!-- ESC key (emerald accent) -->
    <rect x="20" y="38" width="20" height="14" fill="#10B981" rx="3"/>
    <text x="30" y="49" text-anchor="middle" font-size="6" font-weight="bold" fill="white">ESC</text>

    <!-- F1-F12 (small, slate) -->
    <rect x="46" y="40" width="11" height="10" fill="#475569" rx="2"/>
    <text x="51" y="49" text-anchor="middle" font-size="5" fill="#94A3B8">F1</text>
    <rect x="59" y="40" width="11" height="10" fill="#475569" rx="2"/>
    <text x="64" y="49" text-anchor="middle" font-size="5" fill="#94A3B8">F2</text>
    <rect x="72" y="40" width="11" height="10" fill="#475569" rx="2"/>
    <text x="77" y="49" text-anchor="middle" font-size="5" fill="#94A3B8">F3</text>
    <rect x="85" y="40" width="11" height="10" fill="#475569" rx="2"/>
    <text x="90" y="49" text-anchor="middle" font-size="5" fill="#94A3B8">F4</text>
    <rect x="100" y="40" width="11" height="10" fill="#475569" rx="2"/>
    <text x="105" y="49" text-anchor="middle" font-size="5" fill="#94A3B8">F5</text>
    <rect x="113" y="40" width="11" height="10" fill="#475569" rx="2"/>
    <text x="118" y="49" text-anchor="middle" font-size="5" fill="#94A3B8">F6</text>
    <rect x="128" y="40" width="11" height="10" fill="#475569" rx="2"/>
    <text x="133" y="49" text-anchor="middle" font-size="5" fill="#94A3B8">F7</text>
    <rect x="141" y="40" width="11" height="10" fill="#475569" rx="2"/>
    <text x="146" y="49" text-anchor="middle" font-size="5" fill="#94A3B8">F8</text>
    <rect x="156" y="40" width="11" height="10" fill="#475569" rx="2"/>
    <text x="161" y="49" text-anchor="middle" font-size="5" fill="#94A3B8">F12</text>
  </g>

  <!-- Number row -->
  <g>
    <rect x="20" y="56" width="14" height="14" fill="#F1F5F9" rx="3"/>
    <text x="27" y="67" text-anchor="middle" font-size="7" fill="#1E293B" font-weight="600">`</text>
    <rect x="36" y="56" width="14" height="14" fill="#F1F5F9" rx="3"/>
    <text x="43" y="67" text-anchor="middle" font-size="7" fill="#1E293B" font-weight="600">1</text>
    <rect x="52" y="56" width="14" height="14" fill="#F1F5F9" rx="3"/>
    <text x="59" y="67" text-anchor="middle" font-size="7" fill="#1E293B" font-weight="600">2</text>
    <rect x="68" y="56" width="14" height="14" fill="#F1F5F9" rx="3"/>
    <text x="75" y="67" text-anchor="middle" font-size="7" fill="#1E293B" font-weight="600">3</text>
    <rect x="84" y="56" width="14" height="14" fill="#F1F5F9" rx="3"/>
    <text x="91" y="67" text-anchor="middle" font-size="7" fill="#1E293B" font-weight="600">4</text>
    <rect x="100" y="56" width="14" height="14" fill="#F1F5F9" rx="3"/>
    <text x="107" y="67" text-anchor="middle" font-size="7" fill="#1E293B" font-weight="600">5</text>
    <rect x="116" y="56" width="14" height="14" fill="#F1F5F9" rx="3"/>
    <text x="123" y="67" text-anchor="middle" font-size="7" fill="#1E293B" font-weight="600">6</text>
    <rect x="132" y="56" width="14" height="14" fill="#F1F5F9" rx="3"/>
    <text x="139" y="67" text-anchor="middle" font-size="7" fill="#1E293B" font-weight="600">7</text>
    <rect x="148" y="56" width="14" height="14" fill="#F1F5F9" rx="3"/>
    <text x="155" y="67" text-anchor="middle" font-size="7" fill="#1E293B" font-weight="600">8</text>
    <rect x="164" y="56" width="20" height="14" fill="#F1F5F9" rx="3"/>
    <text x="174" y="67" text-anchor="middle" font-size="6" fill="#1E293B" font-weight="600">DEL</text>
  </g>

  <!-- QWERTY row -->
  <g>
    <rect x="20" y="73" width="20" height="14" fill="#F1F5F9" rx="3"/>
    <text x="30" y="84" text-anchor="middle" font-size="7" fill="#1E293B" font-weight="600">TAB</text>
    <rect x="42" y="73" width="14" height="14" fill="#F1F5F9" rx="3"/>
    <text x="49" y="84" text-anchor="middle" font-size="8" fill="#1E293B" font-weight="600">Q</text>
    <rect x="58" y="73" width="14" height="14" fill="#F1F5F9" rx="3"/>
    <text x="65" y="84" text-anchor="middle" font-size="8" fill="#1E293B" font-weight="600">W</text>
    <rect x="74" y="73" width="14" height="14" fill="#F1F5F9" rx="3"/>
    <text x="81" y="84" text-anchor="middle" font-size="8" fill="#1E293B" font-weight="600">E</text>
    <rect x="90" y="73" width="14" height="14" fill="#F1F5F9" rx="3"/>
    <text x="97" y="84" text-anchor="middle" font-size="8" fill="#1E293B" font-weight="600">R</text>
    <rect x="106" y="73" width="14" height="14" fill="#F1F5F9" rx="3"/>
    <text x="113" y="84" text-anchor="middle" font-size="8" fill="#1E293B" font-weight="600">T</text>
    <rect x="122" y="73" width="14" height="14" fill="#F1F5F9" rx="3"/>
    <text x="129" y="84" text-anchor="middle" font-size="8" fill="#1E293B" font-weight="600">Y</text>
    <rect x="138" y="73" width="14" height="14" fill="#F1F5F9" rx="3"/>
    <text x="145" y="84" text-anchor="middle" font-size="8" fill="#1E293B" font-weight="600">U</text>
    <rect x="154" y="73" width="14" height="14" fill="#F1F5F9" rx="3"/>
    <text x="161" y="84" text-anchor="middle" font-size="8" fill="#1E293B" font-weight="600">I</text>
  </g>

  <!-- Home row (ASDF...) with some key-top specular highlights -->
  <g>
    <rect x="20" y="90" width="22" height="14" fill="#F1F5F9" rx="3"/>
    <text x="31" y="101" text-anchor="middle" font-size="6" fill="#1E293B" font-weight="600">CAPS</text>
    <rect x="44" y="90" width="14" height="14" fill="#F1F5F9" rx="3"/>
    <text x="51" y="101" text-anchor="middle" font-size="8" fill="#1E293B" font-weight="600">A</text>
    <!-- F key highlight (homing bump) -->
    <rect x="60" y="90" width="14" height="14" fill="#E2E8F0" rx="3"/>
    <text x="67" y="101" text-anchor="middle" font-size="8" fill="#1E293B" font-weight="600">S</text>
    <rect x="76" y="90" width="14" height="14" fill="#F1F5F9" rx="3"/>
    <text x="83" y="101" text-anchor="middle" font-size="8" fill="#1E293B" font-weight="600">D</text>
    <rect x="92" y="90" width="14" height="14" fill="#E2E8F0" rx="3"/>
    <text x="99" y="101" text-anchor="middle" font-size="8" fill="#1E293B" font-weight="600">F</text>
    <!-- F homing dot -->
    <rect x="97" y="102" width="4" height="1.5" fill="#94A3B8" rx="1"/>
    <rect x="108" y="90" width="14" height="14" fill="#F1F5F9" rx="3"/>
    <text x="115" y="101" text-anchor="middle" font-size="8" fill="#1E293B" font-weight="600">G</text>
    <rect x="124" y="90" width="14" height="14" fill="#F1F5F9" rx="3"/>
    <text x="131" y="101" text-anchor="middle" font-size="8" fill="#1E293B" font-weight="600">H</text>
    <rect x="140" y="90" width="14" height="14" fill="#F1F5F9" rx="3"/>
    <text x="147" y="101" text-anchor="middle" font-size="8" fill="#1E293B" font-weight="600">J</text>
    <!-- J homing dot -->
    <rect x="145" y="102" width="4" height="1.5" fill="#94A3B8" rx="1"/>
    <rect x="156" y="90" width="28" height="14" fill="#F1F5F9" rx="3"/>
    <text x="170" y="101" text-anchor="middle" font-size="6" fill="#1E293B" font-weight="600">ENTER</text>
  </g>

  <!-- Bottom row: space bar prominent, ctrl/alt etc -->
  <g>
    <rect x="20" y="107" width="22" height="14" fill="#334155" rx="3"/>
    <text x="31" y="118" text-anchor="middle" font-size="6" fill="#94A3B8" font-weight="600">SHIFT</text>
    <rect x="44" y="107" width="14" height="14" fill="#F1F5F9" rx="3"/>
    <text x="51" y="118" text-anchor="middle" font-size="8" fill="#1E293B" font-weight="600">Z</text>
    <rect x="60" y="107" width="14" height="14" fill="#F1F5F9" rx="3"/>
    <text x="67" y="118" text-anchor="middle" font-size="8" fill="#1E293B" font-weight="600">X</text>
    <rect x="76" y="107" width="14" height="14" fill="#F1F5F9" rx="3"/>
    <text x="83" y="118" text-anchor="middle" font-size="8" fill="#1E293B" font-weight="600">C</text>
    <!-- Space bar -->
    <rect x="92" y="107" width="62" height="14" fill="#E2E8F0" rx="3"/>
    <!-- Spacebar stabilizer marks -->
    <rect x="108" y="118" width="8" height="1.5" fill="#94A3B8" rx="1" opacity="0.5"/>
    <rect x="136" y="118" width="8" height="1.5" fill="#94A3B8" rx="1" opacity="0.5"/>
    <rect x="156" y="107" width="28" height="14" fill="#334155" rx="3"/>
    <text x="170" y="118" text-anchor="middle" font-size="6" fill="#94A3B8" font-weight="600">SHIFT</text>
  </g>

  <!-- RGB underglow strip -->
  <rect x="12" y="116" width="176" height="4" fill="none" rx="2"/>
  <rect x="14" y="116" width="40" height="3" fill="#F87171" rx="1" opacity="0.6"/>
  <rect x="58" y="116" width="40" height="3" fill="#FBBF24" rx="1" opacity="0.6"/>
  <rect x="102" y="116" width="40" height="3" fill="#34D399" rx="1" opacity="0.6"/>
  <rect x="146" y="116" width="40" height="3" fill="#60A5FA" rx="1" opacity="0.6"/>

  <!-- Cable -->
  <path d="M 100 118 Q 100 128 90 132 Q 80 136 75 136" fill="none" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
  <!-- USB plug -->
  <rect x="58" y="131" width="18" height="8" fill="#475569" rx="2"/>
  <rect x="60" y="133" width="14" height="4" fill="#64748B" rx="1"/>
</svg>
