<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 180" width="100%" height="100%" fill="none">
  <!-- Braided USB-C Cable extending out top -->
  <path d="M 70 30 Q 70 10 110 10 L 220 10" stroke="#71717A" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <rect x="65" y="24" width="10" height="10" rx="2" fill="#18181B"/>

  <!-- Keyboard Solid Chassis -->
  <rect x="20" y="32" width="240" height="126" rx="10" fill="#FFFFFF" stroke="#18181B" stroke-width="2.5"/>
  <rect x="25" y="37" width="230" height="116" rx="7" fill="#F7F7F5" stroke="#E4E4E7" stroke-width="1.2"/>

  <!-- Keycap Rows (Editorial TKL Minimal Layout) -->
  <!-- Function Row (ESC + F1-F12 + PrtSc) -->
  <g fill="#FFFFFF" stroke="#18181B" stroke-width="1.2">
    <!-- ESC (Accent Emerald) -->
    <rect x="32" y="44" width="13" height="11" rx="2.5" fill="#0F766E" stroke="#18181B"/>
    <text x="38.5" y="52" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="5" font-weight="700" text-anchor="middle">ESC</text>

    <!-- F1-F4 -->
    <rect x="52" y="44" width="11" height="11" rx="2"/>
    <rect x="65" y="44" width="11" height="11" rx="2"/>
    <rect x="78" y="44" width="11" height="11" rx="2"/>
    <rect x="91" y="44" width="11" height="11" rx="2"/>

    <!-- F5-F8 -->
    <rect x="108" y="44" width="11" height="11" rx="2"/>
    <rect x="121" y="44" width="11" height="11" rx="2"/>
    <rect x="134" y="44" width="11" height="11" rx="2"/>
    <rect x="147" y="44" width="11" height="11" rx="2"/>

    <!-- F9-F12 -->
    <rect x="164" y="44" width="11" height="11" rx="2"/>
    <rect x="177" y="44" width="11" height="11" rx="2"/>
    <rect x="190" y="44" width="11" height="11" rx="2"/>
    <rect x="203" y="44" width="11" height="11" rx="2"/>

    <!-- Nav Cluster Top -->
    <rect x="222" y="44" width="11" height="11" rx="2"/>
    <rect x="235" y="44" width="11" height="11" rx="2"/>
  </g>

  <!-- Number Row -->
  <g fill="#FFFFFF" stroke="#18181B" stroke-width="1.2">
    <rect x="32" y="60" width="11" height="13" rx="2"/>
    <rect x="45" y="60" width="11" height="13" rx="2"/>
    <rect x="58" y="60" width="11" height="13" rx="2"/>
    <rect x="71" y="60" width="11" height="13" rx="2"/>
    <rect x="84" y="60" width="11" height="13" rx="2"/>
    <rect x="97" y="60" width="11" height="13" rx="2"/>
    <rect x="110" y="60" width="11" height="13" rx="2"/>
    <rect x="123" y="60" width="11" height="13" rx="2"/>
    <rect x="136" y="60" width="11" height="13" rx="2"/>
    <rect x="149" y="60" width="11" height="13" rx="2"/>
    <rect x="162" y="60" width="11" height="13" rx="2"/>
    <rect x="175" y="60" width="11" height="13" rx="2"/>
    <rect x="188" y="60" width="11" height="13" rx="2"/>
    <!-- Backspace -->
    <rect x="201" y="60" width="17" height="13" rx="2" fill="#E4E4E7"/>
    <text x="209" y="69" fill="#18181B" font-family="Inter, sans-serif" font-size="5" font-weight="700" text-anchor="middle">←</text>

    <!-- Nav row 1 -->
    <rect x="222" y="60" width="11" height="13" rx="2"/>
    <rect x="235" y="60" width="11" height="13" rx="2"/>
  </g>

  <!-- QWERTY Row -->
  <g fill="#FFFFFF" stroke="#18181B" stroke-width="1.2">
    <!-- Tab -->
    <rect x="32" y="77" width="16" height="13" rx="2" fill="#E4E4E7"/>
    <rect x="50" y="77" width="11" height="13" rx="2"/>
    <rect x="63" y="77" width="11" height="13" rx="2"/>
    <rect x="76" y="77" width="11" height="13" rx="2"/>
    <rect x="89" y="77" width="11" height="13" rx="2"/>
    <rect x="102" y="77" width="11" height="13" rx="2"/>
    <rect x="115" y="77" width="11" height="13" rx="2"/>
    <rect x="128" y="77" width="11" height="13" rx="2"/>
    <rect x="141" y="77" width="11" height="13" rx="2"/>
    <rect x="154" y="77" width="11" height="13" rx="2"/>
    <rect x="167" y="77" width="11" height="13" rx="2"/>
    <rect x="180" y="77" width="11" height="13" rx="2"/>
    <rect x="193" y="77" width="11" height="13" rx="2"/>
    <rect x="206" y="77" width="12" height="13" rx="2"/>

    <!-- Nav row 2 -->
    <rect x="222" y="77" width="11" height="13" rx="2"/>
    <rect x="235" y="77" width="11" height="13" rx="2"/>
  </g>

  <!-- ASDF Home Row -->
  <g fill="#FFFFFF" stroke="#18181B" stroke-width="1.2">
    <!-- Caps Lock -->
    <rect x="32" y="94" width="19" height="13" rx="2" fill="#E4E4E7"/>
    <rect x="53" y="94" width="11" height="13" rx="2"/>
    <rect x="66" y="94" width="11" height="13" rx="2"/>
    <rect x="79" y="94" width="11" height="13" rx="2"/>
    <rect x="92" y="94" width="11" height="13" rx="2"/>
    <rect x="105" y="94" width="11" height="13" rx="2"/>
    <rect x="118" y="94" width="11" height="13" rx="2"/>
    <rect x="131" y="94" width="11" height="13" rx="2"/>
    <rect x="144" y="94" width="11" height="13" rx="2"/>
    <rect x="157" y="94" width="11" height="13" rx="2"/>
    <rect x="170" y="94" width="11" height="13" rx="2"/>
    <rect x="183" y="94" width="11" height="13" rx="2"/>
    <!-- ISO Enter (Obsidian ink) -->
    <rect x="196" y="94" width="22" height="13" rx="2" fill="#18181B"/>
    <text x="207" y="103" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="5" font-weight="700" text-anchor="middle">↵</text>

    <!-- Nav row 3 -->
    <rect x="222" y="94" width="11" height="13" rx="2"/>
    <rect x="235" y="94" width="11" height="13" rx="2"/>
  </g>

  <!-- ZXCV Row -->
  <g fill="#FFFFFF" stroke="#18181B" stroke-width="1.2">
    <!-- Shift Left -->
    <rect x="32" y="111" width="24" height="13" rx="2" fill="#E4E4E7"/>
    <rect x="58" y="111" width="11" height="13" rx="2"/>
    <rect x="71" y="111" width="11" height="13" rx="2"/>
    <rect x="84" y="111" width="11" height="13" rx="2"/>
    <rect x="97" y="111" width="11" height="13" rx="2"/>
    <rect x="110" y="111" width="11" height="13" rx="2"/>
    <rect x="123" y="111" width="11" height="13" rx="2"/>
    <rect x="136" y="111" width="11" height="13" rx="2"/>
    <rect x="149" y="111" width="11" height="13" rx="2"/>
    <rect x="162" y="111" width="11" height="13" rx="2"/>
    <rect x="175" y="111" width="11" height="13" rx="2"/>
    <!-- Shift Right -->
    <rect x="188" y="111" width="30" height="13" rx="2" fill="#E4E4E7"/>

    <!-- Up Arrow -->
    <rect x="228" y="111" width="12" height="13" rx="2"/>
    <text x="234" y="120" fill="#18181B" font-family="Inter, sans-serif" font-size="6" font-weight="700" text-anchor="middle">▲</text>
  </g>

  <!-- Bottom Row & Spacebar -->
  <g fill="#FFFFFF" stroke="#18181B" stroke-width="1.2">
    <rect x="32" y="128" width="14" height="14" rx="2" fill="#E4E4E7"/>
    <rect x="48" y="128" width="13" height="14" rx="2" fill="#E4E4E7"/>
    <rect x="63" y="128" width="14" height="14" rx="2" fill="#E4E4E7"/>
    <!-- Long Spacebar -->
    <rect x="79" y="128" width="82" height="14" rx="3" fill="#FFFFFF"/>
    <rect x="163" y="128" width="14" height="14" rx="2" fill="#E4E4E7"/>
    <rect x="179" y="128" width="13" height="14" rx="2" fill="#E4E4E7"/>
    <rect x="194" y="128" width="14" height="14" rx="2" fill="#E4E4E7"/>

    <!-- Arrows: Left, Down, Right -->
    <rect x="214" y="128" width="12" height="14" rx="2"/>
    <text x="220" y="138" fill="#18181B" font-family="Inter, sans-serif" font-size="6" font-weight="700" text-anchor="middle">◀</text>

    <rect x="228" y="128" width="12" height="14" rx="2"/>
    <text x="234" y="138" fill="#18181B" font-family="Inter, sans-serif" font-size="6" font-weight="700" text-anchor="middle">▼</text>

    <rect x="242" y="128" width="12" height="14" rx="2"/>
    <text x="248" y="138" fill="#18181B" font-family="Inter, sans-serif" font-size="6" font-weight="700" text-anchor="middle">▶</text>
  </g>
</svg>
