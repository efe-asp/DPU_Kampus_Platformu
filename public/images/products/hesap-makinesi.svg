<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 300" width="100%" height="100%" fill="none">
  <!-- Calculator Body -->
  <rect x="36" y="20" width="168" height="260" rx="20" fill="#FFFFFF" stroke="#18181B" stroke-width="2.5"/>
  <rect x="42" y="26" width="156" height="248" rx="16" fill="#F7F7F5" stroke="#E4E4E7" stroke-width="1.5"/>

  <!-- Brand label -->
  <text x="56" y="52" fill="#18181B" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="-0.3">CASIO</text>
  <text x="140" y="52" fill="#71717A" font-family="Inter, monospace" font-size="8.5" font-weight="600">FX-991ES</text>

  <!-- Solar panel & LCD display -->
  <g transform="translate(52, 60)">
    <rect width="136" height="52" rx="6" fill="#FFFFFF" stroke="#18181B" stroke-width="2"/>
    
    <!-- Solar cell strip -->
    <rect x="94" y="6" width="36" height="10" rx="2" fill="#0F766E" opacity="0.85"/>
    <line x1="106" y1="6" x2="106" y2="16" stroke="#FFFFFF" stroke-width="0.8"/>
    <line x1="118" y1="6" x2="118" y2="16" stroke="#FFFFFF" stroke-width="0.8"/>

    <!-- Natural Display LCD -->
    <rect x="6" y="19" width="124" height="28" rx="3" fill="#E4E4E7" opacity="0.6"/>
    <text x="12" y="32" fill="#18181B" font-family="Inter, monospace" font-size="9" font-weight="500">∫(3x² + 2x) dx</text>
    <text x="122" y="44" fill="#18181B" font-family="Inter, monospace" font-size="11" font-weight="700" text-anchor="end">42.500</text>
  </g>

  <!-- Replay Circular Pad -->
  <circle cx="120" cy="132" r="14" fill="#FFFFFF" stroke="#18181B" stroke-width="1.8"/>
  <path d="M 120 122 L 122 125 L 118 125 Z" fill="#18181B"/>
  <path d="M 120 142 L 122 139 L 118 139 Z" fill="#18181B"/>
  <path d="M 110 132 L 113 130 L 113 134 Z" fill="#18181B"/>
  <path d="M 130 132 L 127 130 L 127 134 Z" fill="#18181B"/>

  <!-- Function small buttons row 1 -->
  <g fill="#FFFFFF" stroke="#18181B" stroke-width="1.2">
    <rect x="52" y="124" width="16" height="10" rx="3"/>
    <rect x="74" y="124" width="16" height="10" rx="3"/>
    <rect x="150" y="124" width="16" height="10" rx="3"/>
    <rect x="172" y="124" width="16" height="10" rx="3"/>
  </g>

  <!-- Function small buttons row 2 (Calc, Integral, d/dx, x^-1, log) -->
  <g fill="#FFFFFF" stroke="#18181B" stroke-width="1.2">
    <rect x="52" y="152" width="22" height="12" rx="3"/>
    <rect x="80" y="152" width="22" height="12" rx="3"/>
    <rect x="108" y="152" width="24" height="12" rx="3"/>
    <rect x="138" y="152" width="22" height="12" rx="3"/>
    <rect x="166" y="152" width="22" height="12" rx="3"/>
  </g>

  <!-- Numeric & Scientific Keypad Grid -->
  <g fill="#FFFFFF" stroke="#18181B" stroke-width="1.5">
    <!-- Row 1: 7, 8, 9, DEL, AC -->
    <rect x="52" y="174" width="24" height="18" rx="4"/>
    <text x="64" y="187" fill="#18181B" font-family="Inter, sans-serif" font-size="10" font-weight="600" text-anchor="middle">7</text>

    <rect x="82" y="174" width="24" height="18" rx="4"/>
    <text x="94" y="187" fill="#18181B" font-family="Inter, sans-serif" font-size="10" font-weight="600" text-anchor="middle">8</text>

    <rect x="112" y="174" width="24" height="18" rx="4"/>
    <text x="124" y="187" fill="#18181B" font-family="Inter, sans-serif" font-size="10" font-weight="600" text-anchor="middle">9</text>

    <rect x="142" y="174" width="22" height="18" rx="4" fill="#E4E4E7"/>
    <text x="153" y="187" fill="#18181B" font-family="Inter, sans-serif" font-size="8" font-weight="700" text-anchor="middle">DEL</text>

    <rect x="168" y="174" width="22" height="18" rx="4" fill="#0F766E"/>
    <text x="179" y="187" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">AC</text>

    <!-- Row 2: 4, 5, 6, x, / -->
    <rect x="52" y="198" width="24" height="18" rx="4"/>
    <text x="64" y="211" fill="#18181B" font-family="Inter, sans-serif" font-size="10" font-weight="600" text-anchor="middle">4</text>

    <rect x="82" y="198" width="24" height="18" rx="4"/>
    <text x="94" y="211" fill="#18181B" font-family="Inter, sans-serif" font-size="10" font-weight="600" text-anchor="middle">5</text>

    <rect x="112" y="198" width="24" height="18" rx="4"/>
    <text x="124" y="211" fill="#18181B" font-family="Inter, sans-serif" font-size="10" font-weight="600" text-anchor="middle">6</text>

    <rect x="142" y="198" width="22" height="18" rx="4"/>
    <text x="153" y="211" fill="#18181B" font-family="Inter, sans-serif" font-size="10" font-weight="600" text-anchor="middle">×</text>

    <rect x="168" y="198" width="22" height="18" rx="4"/>
    <text x="179" y="211" fill="#18181B" font-family="Inter, sans-serif" font-size="10" font-weight="600" text-anchor="middle">÷</text>

    <!-- Row 3: 1, 2, 3, +, - -->
    <rect x="52" y="222" width="24" height="18" rx="4"/>
    <text x="64" y="235" fill="#18181B" font-family="Inter, sans-serif" font-size="10" font-weight="600" text-anchor="middle">1</text>

    <rect x="82" y="222" width="24" height="18" rx="4"/>
    <text x="94" y="235" fill="#18181B" font-family="Inter, sans-serif" font-size="10" font-weight="600" text-anchor="middle">2</text>

    <rect x="112" y="222" width="24" height="18" rx="4"/>
    <text x="124" y="235" fill="#18181B" font-family="Inter, sans-serif" font-size="10" font-weight="600" text-anchor="middle">3</text>

    <rect x="142" y="222" width="22" height="18" rx="4"/>
    <text x="153" y="235" fill="#18181B" font-family="Inter, sans-serif" font-size="11" font-weight="600" text-anchor="middle">+</text>

    <rect x="168" y="222" width="22" height="18" rx="4"/>
    <text x="179" y="235" fill="#18181B" font-family="Inter, sans-serif" font-size="11" font-weight="600" text-anchor="middle">−</text>

    <!-- Row 4: 0, ., x10^x, Ans, = -->
    <rect x="52" y="246" width="24" height="18" rx="4"/>
    <text x="64" y="259" fill="#18181B" font-family="Inter, sans-serif" font-size="10" font-weight="600" text-anchor="middle">0</text>

    <rect x="82" y="246" width="24" height="18" rx="4"/>
    <text x="94" y="259" fill="#18181B" font-family="Inter, sans-serif" font-size="10" font-weight="600" text-anchor="middle">•</text>

    <rect x="112" y="246" width="24" height="18" rx="4"/>
    <text x="124" y="258" fill="#18181B" font-family="Inter, sans-serif" font-size="8" font-weight="600" text-anchor="middle">x10ˣ</text>

    <rect x="142" y="246" width="22" height="18" rx="4"/>
    <text x="153" y="258" fill="#18181B" font-family="Inter, sans-serif" font-size="8" font-weight="600" text-anchor="middle">Ans</text>

    <rect x="168" y="246" width="22" height="18" rx="4" fill="#18181B"/>
    <text x="179" y="259" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="11" font-weight="700" text-anchor="middle">=</text>
  </g>
</svg>
