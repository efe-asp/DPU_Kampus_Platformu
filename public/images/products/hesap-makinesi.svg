<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200" width="160" height="200">
  <defs>
    <linearGradient id="bg-hm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#DBEAFE"/>
    </linearGradient>
    <linearGradient id="body-hm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="lcd-hm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#BAE6FD"/>
    </linearGradient>
  </defs>
  <!-- Studio backdrop -->
  <rect width="160" height="200" fill="url(#bg-hm)" rx="16"/>
  <!-- Surface shadow -->
  <ellipse cx="80" cy="175" rx="52" ry="10" fill="#93C5FD" opacity="0.3"/>

  <!-- Calculator body -->
  <rect x="30" y="20" width="100" height="150" fill="url(#body-hm)" rx="12"/>
  <!-- Body highlight -->
  <rect x="30" y="20" width="100" height="6" fill="#475569" rx="6"/>
  <!-- Body side highlight -->
  <rect x="30" y="20" width="4" height="150" fill="#475569" rx="2" opacity="0.5"/>

  <!-- Solar strip -->
  <rect x="40" y="30" width="80" height="10" fill="#10B981" rx="4"/>
  <!-- Solar cell lines -->
  <line x1="66" y1="30" x2="66" y2="40" stroke="#059669" stroke-width="1"/>
  <line x1="92" y1="30" x2="92" y2="40" stroke="#059669" stroke-width="1"/>
  <line x1="118" y1="30" x2="118" y2="40" stroke="#059669" stroke-width="1"/>

  <!-- LCD Screen -->
  <rect x="38" y="46" width="84" height="34" fill="url(#lcd-hm)" rx="4"/>
  <!-- Screen inner border -->
  <rect x="40" y="48" width="80" height="30" fill="#E0F2FE" rx="3"/>
  <!-- Display digits -->
  <text x="116" y="72" text-anchor="end" font-family="'Courier New', monospace" font-size="16" font-weight="bold" fill="#0369A1" letter-spacing="1">3,14159</text>
  <!-- Mode indicator -->
  <text x="42" y="58" font-family="'Courier New', monospace" font-size="7" fill="#0EA5E9">STAT</text>

  <!-- Button rows -->
  <!-- Row 1: function keys (teal) -->
  <g>
    <rect x="40" y="88" width="17" height="12" fill="#0F766E" rx="2"/>
    <rect x="61" y="88" width="17" height="12" fill="#0F766E" rx="2"/>
    <rect x="82" y="88" width="17" height="12" fill="#0F766E" rx="2"/>
    <rect x="103" y="88" width="17" height="12" fill="#DC2626" rx="2"/>
    <text x="48" y="98" text-anchor="middle" font-size="6" fill="white" font-weight="bold">SIN</text>
    <text x="69" y="98" text-anchor="middle" font-size="6" fill="white" font-weight="bold">COS</text>
    <text x="90" y="98" text-anchor="middle" font-size="6" fill="white" font-weight="bold">TAN</text>
    <text x="111" y="98" text-anchor="middle" font-size="6" fill="white" font-weight="bold">DEL</text>
  </g>
  <!-- Row 2: operators (slate) -->
  <g>
    <rect x="40" y="104" width="17" height="12" fill="#475569" rx="2"/>
    <rect x="61" y="104" width="17" height="12" fill="#475569" rx="2"/>
    <rect x="82" y="104" width="17" height="12" fill="#475569" rx="2"/>
    <rect x="103" y="104" width="17" height="12" fill="#F59E0B" rx="2"/>
    <text x="48" y="114" text-anchor="middle" font-size="8" fill="white">x&#178;</text>
    <text x="69" y="114" text-anchor="middle" font-size="8" fill="white">&#8730;</text>
    <text x="90" y="114" text-anchor="middle" font-size="8" fill="white">log</text>
    <text x="111" y="114" text-anchor="middle" font-size="8" fill="white">&#247;</text>
  </g>
  <!-- Row 3-4-5: number keys (ivory) -->
  <g>
    <!-- Row 3 -->
    <rect x="40" y="120" width="17" height="12" fill="#F8FAFC" rx="2"/>
    <rect x="61" y="120" width="17" height="12" fill="#F8FAFC" rx="2"/>
    <rect x="82" y="120" width="17" height="12" fill="#F8FAFC" rx="2"/>
    <rect x="103" y="120" width="17" height="12" fill="#F59E0B" rx="2"/>
    <text x="48" y="130" text-anchor="middle" font-size="8" fill="#1E293B" font-weight="600">7</text>
    <text x="69" y="130" text-anchor="middle" font-size="8" fill="#1E293B" font-weight="600">8</text>
    <text x="90" y="130" text-anchor="middle" font-size="8" fill="#1E293B" font-weight="600">9</text>
    <text x="111" y="130" text-anchor="middle" font-size="8" fill="white">&#215;</text>
    <!-- Row 4 -->
    <rect x="40" y="136" width="17" height="12" fill="#F8FAFC" rx="2"/>
    <rect x="61" y="136" width="17" height="12" fill="#F8FAFC" rx="2"/>
    <rect x="82" y="136" width="17" height="12" fill="#F8FAFC" rx="2"/>
    <rect x="103" y="136" width="17" height="12" fill="#F59E0B" rx="2"/>
    <text x="48" y="146" text-anchor="middle" font-size="8" fill="#1E293B" font-weight="600">4</text>
    <text x="69" y="146" text-anchor="middle" font-size="8" fill="#1E293B" font-weight="600">5</text>
    <text x="90" y="146" text-anchor="middle" font-size="8" fill="#1E293B" font-weight="600">6</text>
    <text x="111" y="146" text-anchor="middle" font-size="8" fill="white">&#8722;</text>
    <!-- Row 5 -->
    <rect x="40" y="152" width="17" height="12" fill="#F8FAFC" rx="2"/>
    <rect x="61" y="152" width="17" height="12" fill="#F8FAFC" rx="2"/>
    <rect x="82" y="152" width="17" height="12" fill="#F8FAFC" rx="2"/>
    <rect x="103" y="152" width="17" height="12" fill="#F59E0B" rx="2"/>
    <text x="48" y="162" text-anchor="middle" font-size="8" fill="#1E293B" font-weight="600">1</text>
    <text x="69" y="162" text-anchor="middle" font-size="8" fill="#1E293B" font-weight="600">2</text>
    <text x="90" y="162" text-anchor="middle" font-size="8" fill="#1E293B" font-weight="600">3</text>
    <text x="111" y="162" text-anchor="middle" font-size="8" fill="white">+</text>
  </g>
  <!-- Bottom row -->
  <rect x="40" y="168" width="38" height="12" fill="#F8FAFC" rx="2"/>
  <rect x="82" y="168" width="17" height="12" fill="#F8FAFC" rx="2"/>
  <rect x="103" y="168" width="17" height="12" fill="#10B981" rx="2"/>
  <text x="59" y="178" text-anchor="middle" font-size="8" fill="#1E293B" font-weight="600">0</text>
  <text x="90" y="178" text-anchor="middle" font-size="8" fill="#1E293B" font-weight="600">.</text>
  <text x="111" y="178" text-anchor="middle" font-size="8" fill="white" font-weight="bold">=</text>
</svg>
