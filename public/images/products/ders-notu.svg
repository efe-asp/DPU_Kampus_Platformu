<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%" fill="none">
  <!-- Warm background base -->
  <rect width="240" height="240" fill="transparent"/>

  <!-- Under-layer Folder / Notebook 1 (Rotated slightly) -->
  <g transform="rotate(-6 120 120)">
    <rect x="42" y="32" width="144" height="180" rx="8" fill="#F4F4F5" stroke="#18181B" stroke-width="2"/>
    <rect x="48" y="38" width="132" height="168" rx="5" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1"/>
    <!-- Page lines -->
    <line x1="60" y1="60" x2="160" y2="60" stroke="#E4E4E7" stroke-width="1.5"/>
    <line x1="60" y1="78" x2="160" y2="78" stroke="#E4E4E7" stroke-width="1.5"/>
    <line x1="60" y1="96" x2="160" y2="96" stroke="#E4E4E7" stroke-width="1.5"/>
  </g>

  <!-- Front Spiral Notebook with DPÜ Engineering Notes -->
  <g transform="translate(10, 5)">
    <!-- Cover -->
    <rect x="52" y="36" width="146" height="178" rx="8" fill="#FFFFFF" stroke="#18181B" stroke-width="2"/>
    
    <!-- Accent margin tape / badge -->
    <rect x="52" y="36" width="22" height="178" rx="8" fill="#F7F7F5"/>
    <rect x="68" y="36" width="6" height="178" fill="#0F766E"/>

    <!-- Wire spiral bindings -->
    <g fill="#FFFFFF" stroke="#18181B" stroke-width="1.5">
      <rect x="46" y="50" width="14" height="6" rx="3"/>
      <rect x="46" y="68" width="14" height="6" rx="3"/>
      <rect x="46" y="86" width="14" height="6" rx="3"/>
      <rect x="46" y="104" width="14" height="6" rx="3"/>
      <rect x="46" y="122" width="14" height="6" rx="3"/>
      <rect x="46" y="140" width="14" height="6" rx="3"/>
      <rect x="46" y="158" width="14" height="6" rx="3"/>
      <rect x="46" y="176" width="14" height="6" rx="3"/>
      <rect x="46" y="194" width="14" height="6" rx="3"/>
    </g>

    <!-- Notes Content Title & Handwriting lines -->
    <text x="86" y="64" fill="#18181B" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="-0.2">DPÜ MÜHENDİSLİK</text>
    <text x="86" y="76" fill="#0F766E" font-family="Inter, system-ui, sans-serif" font-size="8" font-weight="600">Veri Yapıları &amp; Algoritmalar</text>

    <!-- Code / diagram doodle (Binary Tree) -->
    <g stroke="#18181B" stroke-width="1.2" stroke-linecap="round">
      <circle cx="132" cy="100" r="5" fill="#FFFFFF"/>
      <line x1="128" y1="104" x2="114" y2="118"/>
      <line x1="136" y1="104" x2="150" y2="118"/>
      <circle cx="114" cy="120" r="4.5" fill="#E4E4E7"/>
      <circle cx="150" cy="120" r="4.5" fill="#E4E4E7"/>
    </g>

    <!-- Hand-ruled lines -->
    <line x1="86" y1="145" x2="182" y2="145" stroke="#E4E4E7" stroke-width="1.5"/>
    <line x1="86" y1="160" x2="175" y2="160" stroke="#E4E4E7" stroke-width="1.5"/>
    <line x1="86" y1="175" x2="180" y2="175" stroke="#E4E4E7" stroke-width="1.5"/>
    <line x1="86" y1="190" x2="150" y2="190" stroke="#E4E4E7" stroke-width="1.5"/>

    <!-- Bookmark ribbon -->
    <path d="M 160 34 L 160 70 L 168 62 L 176 70 L 176 34 Z" fill="#18181B"/>
  </g>

  <!-- Editorial Pencil lying alongside -->
  <g transform="translate(192, 110) rotate(25)">
    <polygon points="0,0 8,0 8,80 0,80" fill="#F7F7F5" stroke="#18181B" stroke-width="1.5"/>
    <polygon points="0,0 4,-12 8,0" fill="#FFFFFF" stroke="#18181B" stroke-width="1.5"/>
    <polygon points="2,-6 4,-12 6,-6" fill="#18181B"/>
    <rect x="0" y="70" width="8" height="14" rx="2" fill="#0F766E" stroke="#18181B" stroke-width="1.2"/>
  </g>
</svg>
