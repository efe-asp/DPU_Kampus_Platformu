<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 180" width="160" height="180">
  <defs>
    <linearGradient id="bg-dn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0FDF4"/>
      <stop offset="100%" stop-color="#DCFCE7"/>
    </linearGradient>
  </defs>
  <!-- Studio backdrop -->
  <rect width="160" height="180" fill="url(#bg-dn)" rx="16"/>
  <!-- Shadow -->
  <ellipse cx="80" cy="162" rx="55" ry="8" fill="#86EFAC" opacity="0.4"/>

  <!-- Back notebook (yellow) -->
  <rect x="58" y="30" width="78" height="108" fill="#FEF9C3" rx="6" transform="rotate(8, 97, 84)"/>
  <rect x="58" y="30" width="12" height="108" fill="#FDE68A" rx="4" transform="rotate(8, 97, 84)"/>
  <!-- Lines on back -->
  <line x1="78" y1="55" x2="130" y2="47" stroke="#FDE68A" stroke-width="1.5" opacity="0.6"/>
  <line x1="78" y1="65" x2="130" y2="57" stroke="#FDE68A" stroke-width="1.5" opacity="0.6"/>
  <line x1="78" y1="75" x2="130" y2="67" stroke="#FDE68A" stroke-width="1.5" opacity="0.6"/>

  <!-- Middle notebook (blue) -->
  <rect x="42" y="38" width="78" height="108" fill="#EFF6FF" rx="6" transform="rotate(-3, 81, 92)"/>
  <rect x="42" y="38" width="12" height="108" fill="#BFDBFE" rx="4" transform="rotate(-3, 81, 92)"/>
  <!-- Lines on middle -->
  <line x1="58" y1="62" x2="112" y2="60" stroke="#BFDBFE" stroke-width="1.5" opacity="0.6"/>
  <line x1="58" y1="72" x2="112" y2="70" stroke="#BFDBFE" stroke-width="1.5" opacity="0.6"/>
  <line x1="58" y1="82" x2="112" y2="80" stroke="#BFDBFE" stroke-width="1.5" opacity="0.6"/>

  <!-- Front notebook (sage green) - main -->
  <rect x="24" y="42" width="78" height="110" fill="#D1FAE5" rx="6"/>
  <!-- Spine -->
  <rect x="24" y="42" width="13" height="110" fill="#6EE7B7" rx="4"/>
  <!-- Spine decorative lines -->
  <line x1="30" y1="55" x2="30" y2="140" stroke="#34D399" stroke-width="1" stroke-dasharray="3,4"/>

  <!-- Notebook cover label -->
  <rect x="38" y="58" width="58" height="28" fill="white" rx="3" opacity="0.7"/>
  <text x="67" y="72" text-anchor="middle" font-family="Georgia, serif" font-size="7" fill="#065F46" font-weight="bold">MATEMAT&#304;K</text>
  <text x="67" y="82" text-anchor="middle" font-family="Georgia, serif" font-size="6" fill="#059669">2024-2025</text>

  <!-- Content lines -->
  <line x1="38" y1="94" x2="96" y2="94" stroke="#A7F3D0" stroke-width="1.5"/>
  <line x1="38" y1="104" x2="96" y2="104" stroke="#A7F3D0" stroke-width="1.5"/>
  <line x1="38" y1="114" x2="96" y2="114" stroke="#A7F3D0" stroke-width="1.5"/>
  <line x1="38" y1="124" x2="80" y2="124" stroke="#A7F3D0" stroke-width="1.5"/>

  <!-- Formula sketch on page -->
  <text x="45" y="102" font-family="'Courier New', monospace" font-size="7" fill="#065F46" opacity="0.6">&#8747;f(x)dx = F(x)+C</text>

  <!-- Pen / pencil -->
  <g transform="translate(108, 50) rotate(35)">
    <rect x="-3" y="-55" width="6" height="55" fill="#DC2626" rx="2"/>
    <rect x="-3" y="-60" width="6" height="8" fill="#FEF3C7" rx="1"/>
    <polygon points="-3,0 3,0 0,10" fill="#F5CBA7"/>
    <polygon points="-1,8 1,8 0,11" fill="#2C2C2C"/>
    <!-- Eraser -->
    <rect x="-3" y="-66" width="6" height="8" fill="#FDA4AF" rx="1"/>
    <rect x="-3" y="-66" width="6" height="2" fill="#9F1239"/>
  </g>

  <!-- Small sticky note -->
  <rect x="82" y="90" width="30" height="30" fill="#FEF08A" rx="2" transform="rotate(5, 97, 105)"/>
  <line x1="86" y1="100" x2="108" y2="99" stroke="#EAB308" stroke-width="1" opacity="0.6"/>
  <line x1="86" y1="107" x2="108" y2="106" stroke="#EAB308" stroke-width="1" opacity="0.6"/>
  <line x1="86" y1="114" x2="100" y2="113" stroke="#EAB308" stroke-width="1" opacity="0.6"/>
</svg>
