<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="60%" stop-color="#1E3A5F"/>
      <stop offset="100%" stop-color="#164E63"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D1FAE5"/>
      <stop offset="100%" stop-color="#A7F3D0"/>
    </linearGradient>
    <linearGradient id="building" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="dome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <radialGradient id="moon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FEF9C3"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </radialGradient>
  </defs>

  <!-- Sky background -->
  <rect width="480" height="260" fill="url(#sky)"/>
  <!-- Ground -->
  <rect y="240" width="480" height="80" fill="url(#ground)"/>
  <!-- Ground path -->
  <ellipse cx="240" cy="260" rx="240" ry="30" fill="#6EE7B7" opacity="0.4"/>

  <!-- Stars -->
  <circle cx="30" cy="20" r="1.5" fill="white" opacity="0.8"/>
  <circle cx="80" cy="45" r="1" fill="white" opacity="0.6"/>
  <circle cx="140" cy="15" r="1.5" fill="white" opacity="0.7"/>
  <circle cx="200" cy="35" r="1" fill="white" opacity="0.5"/>
  <circle cx="310" cy="20" r="1.5" fill="white" opacity="0.8"/>
  <circle cx="380" cy="40" r="1" fill="white" opacity="0.6"/>
  <circle cx="420" cy="18" r="1.5" fill="white" opacity="0.7"/>
  <circle cx="460" cy="55" r="1" fill="white" opacity="0.5"/>
  <circle cx="55" cy="70" r="1" fill="white" opacity="0.4"/>
  <circle cx="440" cy="75" r="1" fill="white" opacity="0.4"/>

  <!-- Moon -->
  <circle cx="420" cy="45" r="22" fill="url(#moon)" opacity="0.9"/>
  <circle cx="430" cy="38" r="17" fill="#1E3A5F" opacity="0.9"/>

  <!-- Left tree -->
  <rect x="38" y="195" width="8" height="55" fill="#78350F"/>
  <ellipse cx="42" cy="180" rx="22" ry="30" fill="#064E3B"/>
  <ellipse cx="42" cy="168" rx="16" ry="22" fill="#065F46"/>
  <ellipse cx="42" cy="158" rx="10" ry="14" fill="#10B981"/>

  <!-- Right tree -->
  <rect x="434" y="195" width="8" height="55" fill="#78350F"/>
  <ellipse cx="438" cy="180" rx="22" ry="30" fill="#064E3B"/>
  <ellipse cx="438" cy="168" rx="16" ry="22" fill="#065F46"/>
  <ellipse cx="438" cy="158" rx="10" ry="14" fill="#10B981"/>

  <!-- Center trees (smaller) -->
  <rect x="100" y="210" width="6" height="40" fill="#92400E"/>
  <ellipse cx="103" cy="198" rx="16" ry="22" fill="#065F46"/>
  <ellipse cx="103" cy="188" rx="11" ry="15" fill="#059669"/>

  <rect x="368" y="210" width="6" height="40" fill="#92400E"/>
  <ellipse cx="371" cy="198" rx="16" ry="22" fill="#065F46"/>
  <ellipse cx="371" cy="188" rx="11" ry="15" fill="#059669"/>

  <!-- Main university building body -->
  <rect x="120" y="120" width="240" height="140" fill="url(#building)" rx="2"/>
  <!-- Building darker base -->
  <rect x="120" y="210" width="240" height="50" fill="#B45309"/>

  <!-- Center wing (taller) -->
  <rect x="175" y="90" width="130" height="170" fill="#FBBF24" rx="2"/>
  <rect x="175" y="210" width="130" height="50" fill="#D97706"/>

  <!-- Building top trim -->
  <rect x="120" y="118" width="240" height="6" fill="#F59E0B"/>
  <rect x="175" y="88" width="130" height="6" fill="#F59E0B"/>

  <!-- Dome base -->
  <rect x="208" y="58" width="64" height="36" fill="#059669" rx="1"/>
  <!-- Dome arch -->
  <ellipse cx="240" cy="60" rx="32" ry="38" fill="url(#dome)"/>
  <!-- Dome highlight -->
  <ellipse cx="232" cy="52" rx="10" ry="14" fill="#34D399" opacity="0.4"/>
  <!-- Dome tip -->
  <circle cx="240" cy="24" r="5" fill="#FCD34D"/>
  <rect x="238" y="10" width="4" height="18" fill="#FCD34D"/>

  <!-- Building columns -->
  <rect x="195" y="150" width="8" height="110" fill="#FDE68A" opacity="0.5" rx="2"/>
  <rect x="224" y="150" width="8" height="110" fill="#FDE68A" opacity="0.5" rx="2"/>
  <rect x="248" y="150" width="8" height="110" fill="#FDE68A" opacity="0.5" rx="2"/>
  <rect x="277" y="150" width="8" height="110" fill="#FDE68A" opacity="0.5" rx="2"/>

  <!-- Main door arch -->
  <rect x="216" y="210" width="48" height="50" fill="#78350F" rx="1"/>
  <ellipse cx="240" cy="210" rx="24" ry="10" fill="#92400E"/>
  <!-- Door detail -->
  <rect x="220" y="218" width="18" height="38" fill="#451A03" rx="1"/>
  <rect x="242" y="218" width="18" height="38" fill="#451A03" rx="1"/>
  <circle cx="238" cy="237" r="2" fill="#FCD34D"/>
  <circle cx="246" cy="237" r="2" fill="#FCD34D"/>

  <!-- Arched windows - upper level -->
  <g>
    <rect x="135" y="135" width="28" height="36" fill="#FEF3C7" rx="1"/>
    <ellipse cx="149" cy="135" rx="14" ry="7" fill="#FEF3C7"/>
    <rect x="135" y="135" width="28" height="36" fill="#F59E0B" opacity="0.15"/>
    <!-- window glow -->
    <rect x="136" y="136" width="12" height="32" fill="#FCD34D" opacity="0.3"/>
    <rect x="150" y="136" width="12" height="32" fill="#FCD34D" opacity="0.3"/>
  </g>
  <g>
    <rect x="317" y="135" width="28" height="36" fill="#FEF3C7" rx="1"/>
    <ellipse cx="331" cy="135" rx="14" ry="7" fill="#FEF3C7"/>
    <rect x="317" y="135" width="28" height="36" fill="#F59E0B" opacity="0.15"/>
    <rect x="318" y="136" width="12" height="32" fill="#FCD34D" opacity="0.3"/>
    <rect x="332" y="136" width="12" height="32" fill="#FCD34D" opacity="0.3"/>
  </g>

  <!-- Center wing windows -->
  <g>
    <rect x="192" y="105" width="26" height="35" fill="#A7F3D0" rx="1"/>
    <ellipse cx="205" cy="105" rx="13" ry="6" fill="#A7F3D0"/>
    <rect x="193" y="106" width="10" height="30" fill="#34D399" opacity="0.3"/>
    <rect x="207" y="106" width="10" height="30" fill="#34D399" opacity="0.3"/>
  </g>
  <g>
    <rect x="262" y="105" width="26" height="35" fill="#A7F3D0" rx="1"/>
    <ellipse cx="275" cy="105" rx="13" ry="6" fill="#A7F3D0"/>
    <rect x="263" y="106" width="10" height="30" fill="#34D399" opacity="0.3"/>
    <rect x="277" y="106" width="10" height="30" fill="#34D399" opacity="0.3"/>
  </g>

  <!-- Flag on dome -->
  <rect x="240" y="6" width="20" height="13" fill="#DC2626" rx="1"/>
  <rect x="240" y="6" width="20" height="6" fill="#DC2626"/>
  <circle cx="250" cy="12" r="4" fill="white" opacity="0.9"/>

  <!-- Path / walkway -->
  <polygon points="195,260 285,260 300,310 180,310" fill="#FDE68A" opacity="0.5"/>
  <polygon points="210,260 270,260 275,310 205,310" fill="#FEF3C7" opacity="0.4"/>

  <!-- Student silhouette 1 (left) -->
  <g transform="translate(145, 235)">
    <circle cx="0" cy="-28" r="7" fill="white"/>
    <rect x="-6" y="-20" width="12" height="20" fill="#10B981" rx="2"/>
    <rect x="-10" y="-18" width="5" height="15" fill="#10B981" rx="2"/>
    <rect x="5" y="-18" width="5" height="15" fill="#10B981" rx="2"/>
    <rect x="-5" y="0" width="4" height="18" fill="#1E293B" rx="1"/>
    <rect x="1" y="0" width="4" height="18" fill="#1E293B" rx="1"/>
    <!-- Bag -->
    <rect x="5" y="-18" width="10" height="14" fill="#0F766E" rx="2"/>
  </g>

  <!-- Student silhouette 2 (right) -->
  <g transform="translate(335, 235)">
    <circle cx="0" cy="-28" r="7" fill="white"/>
    <rect x="-6" y="-20" width="12" height="20" fill="#6366F1" rx="2"/>
    <rect x="-10" y="-18" width="5" height="15" fill="#6366F1" rx="2"/>
    <rect x="5" y="-18" width="5" height="15" fill="#6366F1" rx="2"/>
    <rect x="-5" y="0" width="4" height="18" fill="#1E293B" rx="1"/>
    <rect x="1" y="0" width="4" height="18" fill="#1E293B" rx="1"/>
    <!-- Book -->
    <rect x="-15" y="-10" width="12" height="16" fill="#F59E0B" rx="1"/>
  </g>

  <!-- Bench left -->
  <rect x="68" y="248" width="40" height="4" fill="#D97706" rx="1"/>
  <rect x="72" y="252" width="4" height="10" fill="#B45309"/>
  <rect x="100" y="252" width="4" height="10" fill="#B45309"/>

  <!-- Bench right -->
  <rect x="372" y="248" width="40" height="4" fill="#D97706" rx="1"/>
  <rect x="376" y="252" width="4" height="10" fill="#B45309"/>
  <rect x="404" y="252" width="4" height="10" fill="#B45309"/>

  <!-- DPÜ text on building -->
  <text x="240" y="195" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#78350F" opacity="0.6">D P Ü</text>

  <!-- Subtle lamp posts -->
  <rect x="165" y="220" width="3" height="40" fill="#94A3B8"/>
  <circle cx="166.5" cy="218" r="5" fill="#FCD34D" opacity="0.9"/>
  <rect x="312" y="220" width="3" height="40" fill="#94A3B8"/>
  <circle cx="313.5" cy="218" r="5" fill="#FCD34D" opacity="0.9"/>
</svg>
